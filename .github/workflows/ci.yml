name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release-pr.yml dispatches this on the release branch: its GITHUB_TOKEN push
  # starts no pull_request run, and the release PR needs the required checks.
  workflow_dispatch:

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Mutineer is fork-based (Linux + macOS); Prism ships with Ruby >= 3.4.
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
      - name: Build gem
        run: gem build mutineer.gemspec

  test-minitest6:
    name: test (ruby 3.4, minitest 6)
    runs-on: ubuntu-latest
    # The default Gemfile keeps Minitest 5. The stop at the first failure has
    # separate hooks for Minitest 5 and 6, so each major version needs a run.
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/minitest6.gemfile
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Mutineer clears BUNDLE_* before it runs a test command, so those child
      # processes fall back to the root Gemfile. Install that bundle too.
      - name: Install root bundle
        run: BUNDLE_GEMFILE="$GITHUB_WORKSPACE/Gemfile" bundle install
      - name: Run tests
        run: bundle exec rake test

  docs:
    name: yard strict (ruby 3.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Enforce 100% YARD documentation
        run: bundle exec rake yard:strict

  rails-integration:
    name: rails dogfood (ruby 3.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          # The Rails fixture app has its OWN isolated bundle (Rails must never
          # touch the gem's zero-dep bundle), so cache against that Gemfile.
          bundler-cache: true
          working-directory: test/fixtures/rails_app
      - name: Dogfood mutineer against a real minimal Rails app
        working-directory: test/fixtures/rails_app
        run: bin/dogfood
      # The daemon integration tests run in the gem process but spawn a daemon under
      # the fixture app's bundle (installed above), so they belong in this job.
      - name: Install the gem's own bundle
        run: bundle install
      - name: Daemon integration tests (Phase 2a)
        run: bundle exec rake test:daemon

  site:
    name: website browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      # These tests read the published tree; docs/ no longer carries the
      # generated files (YARD API docs, sitemap, llms-full.txt).
      - name: Build site
        run: bundle exec rake site:build
      - name: Check theme and copy logic
        run: node --test test/site_test.js
      - name: Install browser test tools
        working-directory: test/browser
        run: npm ci
      - name: Install Chromium
        working-directory: test/browser
        run: npx playwright install --with-deps chromium
      - name: Check website in Chromium
        working-directory: test/browser
        run: npm test

  mongoid-integration:
    name: Mongoid ${{ matrix.mongoid }} / RSpec
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mongoid: ["~> 9.0.0", "~> 9.1.0"]
    services:
      mongodb:
        image: mongo:8.2
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGOID_VERSION: ${{ matrix.mongoid }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install Mongoid fixture bundle
        run: BUNDLE_GEMFILE=test/fixtures/mongoid_app/Gemfile bundle install
      - name: Check database isolation and report parity
        run: bundle exec rake test:mongoid

  action-mongoid:
    name: Bundled GitHub action / Mongoid
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.2
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MUTINEER_MONGO_DATABASE: mutineer_action_fixture
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Install fixture bundle and seed MongoDB
        working-directory: test/fixtures/mongoid_app
        run: |
          bundle install
          bundle exec ruby -r ./boot -e 'Invoice.create_indexes; Invoice.create!(reference: "seed", amount: 7)'
      - name: Run the bundled action with two workers
        id: mutation
        uses: ./
        with:
          sources: invoice.rb
          test: spec/invoice_spec.rb
          working-directory: test/fixtures/mongoid_app
          framework: rspec
          rails: "true"
          daemon: "true"
          jobs: "2"
          since: none
          extra-args: --boot boot.rb
          output: mutation-report.json
      - name: Verify the action produced a trustworthy report
        working-directory: test/fixtures/mongoid_app
        run: |
          jq -e '.summary | .killed > 0 and .survived > 0 and .errored == 0 and .timeout == 0 and .uncapturable == 0' mutation-report.json
