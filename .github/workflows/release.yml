name: Release

# Publish is tag-driven: bump Mutineer::VERSION, date the CHANGELOG section, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# This workflow tests and attaches the gem and checksum to a GitHub release.
# RubyGems publication is a separate decision and needs its own publisher setup.
on:
  push:
    # Three-component release tags only: the workflow itself force-pushes the
    # bare floating major tag (v1, v2, ...), which must not re-trigger it.
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub release

# One release at a time. Two tags in the same major (v1.0.0 then v1.0.1)
# overlapping would let the older run force-push @v1 backward after the
# newer one had already moved it. cancel-in-progress: false queues the
# second run instead of cancelling a publish already in flight.
concurrency:
  group: mutineer-release
  cancel-in-progress: false

jobs:
  release:
    name: publish gem as a GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1 — pinned: privileged (id-token) job
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # A mistyped tag must never publish the wrong version. The trigger glob
      # also matches prereleases (v1.3.1-rc1) and junk (v1.2.3.4), which must
      # neither publish nor move the floating major tag that Action users pin.
      - name: "Guard: stable tag matching Mutineer::VERSION"
        run: |
          set -euo pipefail
          # MUTINEER_STABLE_TAG_START
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a stable vMAJOR.MINOR.PATCH tag. Prereleases and malformed tags are not published and do not move the major tag. Aborting release."
            exit 1
          fi
          # MUTINEER_STABLE_TAG_END
          tag="${GITHUB_REF_NAME#v}"
          ver="$(ruby -r ./lib/mutineer/version -e 'print Mutineer::VERSION')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Mutineer::VERSION ($ver). Aborting release."
            exit 1
          fi

      - name: Guard release ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags --no-prune origin refs/heads/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::The release commit is not on main."
            exit 1
          fi

      - name: Tests
        run: bundle exec rake test
      - name: Pages site builds
        run: bundle exec rake site:build

      - name: Build gem and checksum
        run: |
          set -euo pipefail
          gem build mutineer.gemspec
          sha256sum mutineer-mongoid-*.gem > SHA256SUMS

      - name: GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '$0 ~ "^## \\["ver"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then printf 'Release %s\n' "$GITHUB_REF_NAME" > notes.md; fi
          gh release create "$GITHUB_REF_NAME" mutineer-mongoid-*.gem SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md

      # Keep the floating major tag (v1, v2, ...) on the newest release in its
      # line, so `uses: justinallenmarsh/mutineer-mongoid@v1` tracks the latest v1.x.y.
      - name: Move floating major tag
        run: |
          set -euo pipefail
          major="${GITHUB_REF_NAME%%.*}"
          current="$(git ls-remote --tags origin "refs/tags/$major" | awk '{print $1}')"
          if [ -n "$current" ]; then
            git fetch --no-tags origin "$current"
            current_version="$(git show "$current:lib/mutineer/version.rb" | ruby -e 'value = STDIN.read[/VERSION\s*=\s*"([^"]+)"/, 1]; abort "Cannot read current major-tag version" unless value; print value')"
            if ruby -rrubygems -e 'exit(Gem::Version.new(ARGV[0]) > Gem::Version.new(ARGV[1]) ? 0 : 1)' "$current_version" "${GITHUB_REF_NAME#v}"; then
              echo "::notice::Keeping the newer $major release ($current_version)."
              exit 0
            fi
          fi
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push "--force-with-lease=refs/tags/$major:$current" origin "refs/tags/$major"
